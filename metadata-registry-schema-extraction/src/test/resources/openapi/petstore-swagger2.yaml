swagger: "2.0"
info:
  title: "Swagger Petstore Legacy"
  version: "1.0.0"
  description: "A legacy Swagger 2.0 document for backward compatibility testing"
paths: {}
definitions:
  Pet:
    type: object
    required:
      - name
    properties:
      id:
        type: integer
        format: int64
        description: "Unique identifier for the pet"
      name:
        type: string
        description: "The name of the pet"
      status:
        type: string
        description: "pet status in the store"
        enum:
          - available
          - pending
          - sold
      owner:
        $ref: "#/definitions/Owner"
  Owner:
    type: object
    properties:
      id:
        type: integer
        format: int64
      email:
        type: string
        format: email
      phone:
        type: string
