spring:
  application:
    name: metadata-registry
  config:
    # 固定从用户主目录下的 .metadata-registry 加载本地配置，避免依赖 JVM 启动
    # 工作目录（user.dir）导致保存的配置在重启后无法生效。
    import: optional:${user.home}/.metadata-registry/application-local.yml
  datasource:
    url: ${DB_URL:jdbc:sqlite:./metadata_registry.db}
    driver-class-name: ${DB_DRIVER:org.sqlite.JDBC}
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
      # 与下方 hibernate.connection.provider_disables_autocommit=true 配对:
      # 由连接池关闭自动提交,否则事务提交报 "database in auto-commit mode"
      auto-commit: false
  jpa:
    properties:
      hibernate:
        default_schema: ${DB_DEFAULT_SCHEMA:main}
        dialect: ${HIBERNATE_DIALECT:org.hibernate.community.dialect.SQLiteDialect}
        format_sql: true
        jdbc:
          time_zone: Asia/Shanghai
          batch_size: 50
        order_inserts: true
        order_updates: true
        default_batch_fetch_size: 100
        query:
          in_clause_parameter_padding: true
        connection:
          provider_disables_autocommit: true
        hbm2ddl:
          jdbc_metadata_extraction_strategy: individually
    hibernate:
      ddl-auto: ${DDL_AUTO:update}
    show-sql: false
    open-in-view: false
    # 让 Hibernate ddl-auto 先于 Flyway 执行:既有库表由 ddl-auto 历史创建、老迁移不可重放,
    # 全新库先由 Hibernate 建表使 schema 非空,Flyway 方以 baseline-on-migrate 基线化,
    # 只应用基线之后的两个带幂等守卫的新迁移(V20260919001/V20260919002)。
    # 注意:Boot 3.5 下 defer 与 Flyway 互相登记 depends-on 会循环依赖,
    # 由 FlywayAfterJpaConfig 摘除 entityManagerFactory→flyway 边、保留反向依赖固定顺序。
    defer-datasource-initialization: true
  flyway:
    baseline-on-migrate: true
    # 基线到既有最大版本号 20260918002:既有库首次启用 Flyway 时基线化,
    # 只应用其后的 V20260919001/V20260919002(两脚本均带幂等守卫,可安全重入)。
    baseline-version: "20260918002"
    locations: classpath:db/migration/${DB_VENDOR:sqlite}
    enabled: ${FLYWAY_ENABLED:true}
  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false
      indent-output: false
    time-zone: Asia/Shanghai

server:
  port: ${SERVER_PORT:8081}
  servlet:
    context-path: /
  compression:
    enabled: true
    mime-types: application/json,text/html,text/css,application/javascript

management:
  endpoints:
    web:
      exposure:
        include: health,info,loggers
  endpoint:
    health:
      show-details: when-authorized
    loggers:
      enabled: true

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha
  api-docs:
    path: /v3/api-docs

logging:
  level:
    root: INFO
    io.github.matrixlane: INFO
    org.hibernate.SQL: WARN
    org.hibernate.orm.jdbc.bind: WARN

app:
  jwt:
    secret: ${JWT_SECRET:please-replace-with-a-long-random-string-of-at-least-32-bytes-XYZ}
    expires-minutes: ${JWT_EXPIRES_MINUTES:480}
    issuer: metadata-registry
  cors:
    allowed-origins: ${CORS_ORIGINS:http://localhost:5173}
  seed:
    # 演示数据开关：默认关闭。开启后启动时按既有规则灌入 8 条演示 Context
    # （仅当 context 表为空）。静态预置（语言/全局默认策略/占位管理员/标准流转规则）
    # 不受此开关影响，由 StaticDataPresetService 统一预置。
    demo-data:
      enabled: ${SEED_DEMO_DATA_ENABLED:false}

  compliance:
    score:
      weight:
        exact: 1.0
        partial: 0.5
        none: 0.0

mdr:
  inference:
    # AI 元数据推断功能总开关；false 时 /api/v1/inference/** 全部返回功能未启用
    enabled: ${MDR_INFERENCE_ENABLED:true}
    # 默认提供方：cli（本地 CLI Agent），或 Agent 设置中的内置/自定义 id
    provider: ${MDR_INFERENCE_PROVIDER:cli}
    # 每字段候选数上限
    max-candidates: ${MDR_INFERENCE_MAX_CANDIDATES:3}
    cli:
      # ACP 模式：内置 Agent（claude/codex/kimi）经 ACP 协议常驻进程调用。
      # command 非空时与 args 一起覆盖默认提供方所指的内置 Agent 的 ACP 启动命令
      command: ${MDR_INFERENCE_CLI_COMMAND:}
      # 覆盖命令的参数（解释为 ACP server 启动参数）；留空使用内置默认
      # args: ${MDR_INFERENCE_CLI_ARGS:}
      # 单次协作作业超时（秒）：session/prompt 等待时长，超时发送 session/cancel
      timeout-seconds: ${MDR_INFERENCE_CLI_TIMEOUT:180}
      # 常驻进程与每次作业会话目录的基路径（其下分别建独立子目录）
      work-dir: ${MDR_INFERENCE_WORK_DIR:${java.io.tmpdir}/mdr-inference}
