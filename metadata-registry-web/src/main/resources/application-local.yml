spring:
  datasource:
    url: jdbc:sqlite:./metadata_registry.db
    driver-class-name: org.sqlite.JDBC
    hikari:
      connection-timeout: 5000
      auto-commit: false

  jpa:
    properties:
      hibernate:
        dialect: org.hibernate.community.dialect.SQLiteDialect
    hibernate:
      ddl-auto: update
    show-sql: false

  flyway:
    enabled: false

logging:
  level:
    com.zaxxer.hikari: DEBUG
    org.springframework.jdbc: DEBUG

app:
  jwt:
    secret: please-replace-with-a-long-random-string-of-at-least-32-bytes-XYZ
    expires-minutes: 480
  cors:
    allowed-origins: http://localhost:5173
  seed:
    enabled: true
