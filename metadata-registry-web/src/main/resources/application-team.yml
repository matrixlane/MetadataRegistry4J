# 团队版 profile：默认 SQL Server；可通过 DB_VENDOR/DB_URL/DB_DRIVER 切换到达梦等独立数据库。
# 注意：团队版不支持 SQLite（由数据源配置校验强制，见 datasource-configuration 能力）。
# 用法：java -jar metadata-registry-web.jar --spring.profiles.active=team
spring:
  datasource:
    url: ${DB_URL:jdbc:sqlserver://localhost:1433;databaseName=metadata_registry;encrypt=true;trustServerCertificate=true;integratedSecurity=true}
    driver-class-name: ${DB_DRIVER:com.microsoft.sqlserver.jdbc.SQLServerDriver}
    # 先于 EMF 执行（保证在 ddl-auto 前创建 mdr schema；DM 语法不兼容由 continue-on-error 跳过）
    schema: classpath:db/schema-init.sql
    continue-on-error: true
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
  jpa:
    # EXT 实体(28 个物理表名,27 实体类;口径见 orm-team.xml 头注)的 schema="ext" 覆盖;SQLite profile 不加载(实体注解无 schema,见 orm-team.xml 头注)
    # 注意: mapping-resources 不可用 classpath: 前缀(Hibernate 6.6.11 只剥 classpath://),须用裸路径
    mapping-resources: orm/orm-team.xml
    properties:
      hibernate:
        default_schema: ${DB_DEFAULT_SCHEMA:mdr}
  flyway:
    locations: classpath:db/migration/${DB_VENDOR:sqlserver}
    # Flyway 默认只看连接的默认 schema(dbo),而应用表在 mdr/ext 下;不显式指定时
    # 既有库会被判定为空 schema 而跳过基线、从头重放老迁移(不可重放)。schema 历史
    # 表落在首个 schema(mdr)。达梦以用户即模式,可用 FLYWAY_SCHEMAS 环境变量覆盖。
    schemas: ${FLYWAY_SCHEMAS:mdr,ext}
