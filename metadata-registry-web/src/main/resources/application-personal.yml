# 个人版 profile：默认 SQLite 文件库，零外部依赖。
# 用法：java -jar metadata-registry-web.jar --spring.profiles.active=personal
spring:
  datasource:
    url: ${DB_URL:jdbc:sqlite:./data/metadata-registry.db}
    # sqlite-jdbc 不在 Spring Boot DatabaseDriver 枚举中，Hikari 无法从 URL
    # 推断驱动类，必须显式指定（否则启动报 Failed to determine a suitable driver class）。
    driver-class-name: org.sqlite.JDBC
    hikari:
      # SQLite 单写者模型：连接池保持 1，避免 SQLITE_BUSY 雪崩
      maximum-pool-size: 1
      minimum-idle: 1
      # 注意：不要用 connection-init-sql 设置 WAL —— Hikari 在 autoCommit=false
      # 下执行 init SQL，SQLite 报 "cannot change into wal mode from within a transaction"。
      # 需要 WAL 时在 JDBC URL 追加查询参数：?journal_mode=WAL
  jpa:
    # SQLite 下与标准表同名的 EXT 实体,以 ext_ 物理名前缀模拟 schema(见 orm-sqlite.xml 头注)
    mapping-resources: orm/orm-sqlite.xml
    properties:
      hibernate:
        # 显式指定方言（关闭 JDBC 元数据默认后无法自动探测方言）
        dialect: org.hibernate.community.dialect.SQLiteDialect
        # SQLite 无 schema 概念；DatabaseEnvironment 对 SQLITE 一律返回 null
        default_schema: ${DB_DEFAULT_SCHEMA:}
        # 避免启动时批量读取 JDBC 元数据（既有库上 SQLite 方言的
        # 复合 SELECT 会超出 SQLITE_LIMIT_COMPOUND_SELECT 导致启动失败）
        temp:
          use_jdbc_metadata_defaults: false
    hibernate:
      # SQLite 上 ddl-auto=update 在既有库会因批量表元数据读取
      # （too many terms in compound SELECT）失败；表结构改由 Flyway 基线管理
      ddl-auto: none
  flyway:
    enabled: true
    locations: classpath:db/migration/sqlite
    # 外部导入配置（~/.metadata-registry/application-local.yml，经 spring.config.import
    # 对所有 profile 生效）为 SQL Server 设定了 schemas: mdr,ext；SQLite 无 schema 概念，
    # Flyway 检查 mdr.flyway_schema_history 会报 no such table: mdr.sqlite_master 启动失败。
    # 此处显式清空 schema 列表（profile 特定配置优先于导入配置）。
    schemas: []
    # 基线版本继承 application.yml 的 20260918002(既有库经 baseline-on-migrate 基线化,
    # 只应用两个带幂等守卫的新迁移;既有 personal 库由此获得预置名称)。
    # 已知限制:全新 personal 空库无核心表,而全量重放老迁移在 V20260727001 即失败
    # (SQLite 不支持 DROP COLUMN IF EXISTS,该脚本从未可在空库重放),全新库启动失败属既有问题。

app:
  cors:
    allowed-origins: ${CORS_ORIGINS:http://localhost:5173}
