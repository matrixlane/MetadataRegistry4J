spring:
  application:
    name: metadata-registry
  config:
    # 与 metadata-registry-web 内的 application.yml 保持一致：固定从用户主目录加载，
    # 避免本文件（file:./ 优先级高于 classpath）把相对路径的旧配置重新引入。
    import: optional:${user.home}/.metadata-registry/application-local.yml
  datasource:
    url: ${DB_URL:jdbc:sqlite:${user.home}/.metadata-registry/data/metadata-registry.db}
    driver-class-name: ${DB_DRIVER:org.sqlite.JDBC}
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
  jpa:
    properties:
      hibernate:
        default_schema: ${DB_DEFAULT_SCHEMA:main}
        dialect: ${HIBERNATE_DIALECT:org.hibernate.community.dialect.SQLiteDialect}
        format_sql: true
        jdbc:
          time_zone: Asia/Shanghai
          batch_size: 50
        order_inserts: true
        order_updates: true
        default_batch_fetch_size: 100
        query:
          in_clause_parameter_padding: true
        connection:
          provider_disables_autocommit: true
        hbm2ddl:
          jdbc_metadata_extraction_strategy: individually
    hibernate:
      ddl-auto: ${DDL_AUTO:update}
    show-sql: false
    open-in-view: false
  flyway:
    baseline-on-migrate: true
    locations: classpath:db/migration/${DB_VENDOR:sqlite}
    enabled: ${FLYWAY_ENABLED:false}
  mail:
    host: localhost
    port: 25
    properties:
      mail.smtp.auth: false
      mail.smtp.starttls.enable: false
  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false
      indent-output: false
    time-zone: Asia/Shanghai

server:
  port: ${SERVER_PORT:8081}
  servlet:
    context-path: /
  compression:
    enabled: true
    mime-types: application/json,text/html,text/css,application/javascript

management:
  health:
    mail:
      enabled: false
  endpoints:
    web:
      exposure:
        include: health,info,loggers
  endpoint:
    health:
      show-details: when-authorized
    loggers:
      enabled: true

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha
  api-docs:
    path: /v3/api-docs

logging:
  level:
    root: INFO
    io.github.matrixlane: INFO
    org.hibernate.SQL: WARN
    org.hibernate.orm.jdbc.bind: WARN
    com.zaxxer.hikari: DEBUG

app:
  jwt:
    secret: ${JWT_SECRET:please-replace-with-a-long-random-string-of-at-least-32-bytes-XYZ}
    expires-minutes: ${JWT_EXPIRES_MINUTES:480}
    issuer: metadata-registry
  cors:
    allowed-origins: ${CORS_ORIGINS:http://localhost:5173}
  seed:
    enabled: ${SEED_ENABLED:true}

  compliance:
    score:
      weight:
        exact: 1.0
        partial: 0.5
        none: 0.0
